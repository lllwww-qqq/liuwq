﻿<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>证书宇宙 · 刘玮琦</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;500;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FDFBF7; --paper-1: #F9F7F1; --paper-2: #F0ECE0; --paper-3: #E8E3D6;
    --paper-ink: #1D1B16; --paper-ink-soft: #5B5547; --paper-ink-muted: #8A8475;
    --klein: #002FA7; --klein-2: #1E43C4; --klein-soft: rgba(0,47,167,0.08); --klein-halo: rgba(0,47,167,0.35);
    --tiffany: #7CC6C0; --tiffany-2: #81D8D0; --tiffany-soft: rgba(124,198,192,0.18); --tiffany-line: rgba(124,198,192,0.55);
    --font-serif: 'Noto Serif SC', 'Songti SC', Georgia, serif;
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Microsoft YaHei', sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; overflow: hidden; }
  body {
    font-family: var(--font-serif);
    background:
      radial-gradient(circle at 20% 30%, rgba(0,47,167,0.18) 0%, transparent 38%),
      radial-gradient(circle at 80% 70%, rgba(124,198,192,0.20) 0%, transparent 40%),
      radial-gradient(ellipse at center, #1A1F36 0%, #0A0E22 80%);
    color: #E8ECF5;
    position: relative; cursor: none;
    overflow: hidden;
  }
  /* 星空背景 */
  body::before {
    content: ''; position: fixed; inset: 0; z-index: 0; pointer-events: none;
    background-image:
      radial-gradient(1.2px 1.2px at 12% 18%, #fff, transparent),
      radial-gradient(1px 1px at 28% 65%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 42% 22%, #81D8D0, transparent),
      radial-gradient(1px 1px at 55% 80%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 68% 38%, #A5B4FC, transparent),
      radial-gradient(1px 1px at 78% 12%, #fff, transparent),
      radial-gradient(1.5px 1.5px at 88% 65%, #002FA7, transparent),
      radial-gradient(1px 1px at 8% 88%, #fff, transparent),
      radial-gradient(1.2px 1.2px at 35% 48%, #fff, transparent),
      radial-gradient(1px 1px at 62% 92%, #81D8D0, transparent);
    opacity: 0.7;
    animation: twinkle 6s ease-in-out infinite;
  }
  @keyframes twinkle { 0%,100%{opacity:0.45;} 50%{opacity:0.85;} }

  /* 顶部Banner（深色版） */
  .banner {
    position: fixed; top: 0; left: 0; right: 0; z-index: 100;
    height: 56px; padding: 0 32px;
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(10,14,34,0.65); backdrop-filter: blur(16px);
    border-bottom: 1px solid var(--tiffany-line);
  }
  .banner .back {
    display: inline-flex; align-items: center; gap: 10px;
    text-decoration: none; color: #E8ECF5;
    font-family: var(--font-sans); font-size: 0.9rem; letter-spacing: 1px; font-weight: 500;
    transition: color .25s;
  }
  .banner .back:hover { color: var(--tiffany-2); }
  .banner .brand {
    font-family: var(--font-serif); font-size: 0.92rem; letter-spacing: 4px; font-weight: 700;
    color: #fff;
  }
  .banner .brand strong { color: var(--tiffany-2); }

  /* 提示条 */
  .hint-bar {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%); z-index: 50;
    padding: 10px 22px; border-radius: 999px;
    background: rgba(253,251,247,0.12); backdrop-filter: blur(12px);
    border: 1px solid rgba(124,198,192,0.45);
    color: #E8ECF5; font-family: var(--font-sans); font-size: 0.82rem; letter-spacing: 0.8px;
    box-shadow: 0 8px 28px rgba(0,0,0,0.3);
    display: inline-flex; align-items: center; gap: 14px;
    max-width: 92vw;
  }
  .hint-bar .item { display: inline-flex; align-items: center; gap: 6px; }
  .hint-bar .sep { color: var(--tiffany-2); font-weight: 700; opacity: 0.6; }
  .hint-bar .kbd {
    padding: 2px 8px; border-radius: 6px;
    background: rgba(124,198,192,0.22); border: 1px solid var(--tiffany-line);
    font-weight: 700; font-size: 0.76rem;
  }

  /* 标题 */
  .title {
    position: fixed; top: 80px; left: 0; right: 0; z-index: 20;
    text-align: center; pointer-events: none;
  }
  .title h1 {
    font-family: var(--font-serif); font-weight: 900;
    font-size: clamp(2rem, 5vw, 3.4rem);
    letter-spacing: 0.3em;
    color: transparent;
    -webkit-text-stroke: 1.2px #E8ECF5;
    text-shadow: 0 0 30px rgba(124,198,192,0.6);
    margin-bottom: 8px;
  }
  .title h1 .solid {
    -webkit-text-stroke: 0;
    color: #fff;
  }
  .title .sub {
    font-family: var(--font-sans); font-size: 0.78rem; letter-spacing: 5px;
    color: var(--tiffany-2); font-weight: 600; text-transform: uppercase;
  }

  /* 宇宙舞台 */
  .universe {
    position: absolute; inset: 0;
    perspective: 1400px;
    perspective-origin: 50% 45%;
    z-index: 5;
  }
  .scene {
    position: absolute; left: 50%; top: 50%;
    width: 0; height: 0;
    transform-style: preserve-3d;
    transition: transform 0.4s ease-out;
  }
  .card {
    position: absolute;
    width: 140px; height: 186px;
    margin-left: -70px; margin-top: -93px;
    transform-style: preserve-3d;
    cursor: pointer;
    transition: transform 0.6s cubic-bezier(.22,1,.36,1), filter 0.3s, box-shadow 0.3s;
    will-change: transform;
  }
  .card .face {
    position: absolute; inset: 0;
    border-radius: 12px; overflow: hidden;
    background: #F9F7F1;
    border: 1px solid var(--tiffany-line);
    box-shadow: 0 8px 30px rgba(0,0,0,0.45);
    backface-visibility: hidden;
  }
  .card .face img {
    width: 100%; height: 100%; object-fit: cover;
    filter: brightness(0.95);
  }
  .card .glow {
    position: absolute; inset: -8px; border-radius: 16px;
    background: radial-gradient(circle at center, rgba(124,198,192,0.45), transparent 70%);
    z-index: -1; filter: blur(8px);
    opacity: 0.65; transition: opacity 0.3s;
  }
  .card .badge {
    position: absolute; top: 6px; right: 6px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(253,251,247,0.92);
    color: var(--klein);
    font-family: var(--font-sans); font-weight: 700; font-size: 0.72rem;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid var(--tiffany-line);
    z-index: 3;
  }
  /* hover：发光更强 */
  .card:hover .glow { opacity: 1; }
  .card:hover .face { box-shadow: 0 0 0 2px var(--tiffany), 0 14px 40px rgba(0,47,167,0.6); }
  /* 拖拽时 */
  .card.dragging {
    transition: none !important;
    z-index: 9999;
  }
  .card.dragging .face {
    box-shadow: 0 0 0 3px var(--klein), 0 18px 50px rgba(0,47,167,0.8);
  }
  .card.dragging .glow { opacity: 1; background: radial-gradient(circle at center, rgba(0,47,167,0.55), transparent 70%); }

  /* 自定义鼠标 */
  .cursor-dot {
    position: fixed; top: 0; left: 0; width: 6px; height: 6px; border-radius: 50%;
    background: var(--tiffany-2); pointer-events: none; z-index: 99999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 8px rgba(124,198,192,0.55);
    will-change: transform;
  }
  .cursor-ring {
    position: fixed; top: 0; left: 0; width: 44px; height: 44px; border-radius: 50%;
    border: 1.5px solid var(--tiffany-2); pointer-events: none; z-index: 99999;
    transform: translate(-50%,-50%);
    box-shadow: 0 0 14px 2px rgba(124,198,192,0.32);
    transition: width .35s, height .35s, border-color .3s, box-shadow .3s;
    will-change: transform;
  }
  body.is-hovering .cursor-ring {
    width: 72px; height: 72px;
    border-color: var(--klein-2);
    box-shadow: 0 0 22px rgba(0,47,167,0.5);
  }
  body.is-hovering .cursor-dot { opacity: 0; }
  body.is-dragging .cursor-ring {
    width: 30px; height: 30px;
    border-color: var(--klein);
    border-width: 2px;
    background: rgba(0,47,167,0.15);
  }

  /* 查看器（点击放大） */
  .viewer {
    position: fixed; inset: 0; z-index: 9990;
    background: rgba(5,8,22,0.92);
    backdrop-filter: blur(14px);
    display: flex; align-items: center; justify-content: center;
    opacity: 0; pointer-events: none;
    transition: opacity 0.3s;
  }
  .viewer.show { opacity: 1; pointer-events: auto; }
  .viewer .vbox {
    position: relative; max-width: 90vw; max-height: 88vh;
  }
  .viewer img {
    max-width: 90vw; max-height: 82vh;
    border-radius: 12px;
    box-shadow: 0 30px 80px rgba(0,0,0,0.7), 0 0 60px rgba(124,198,192,0.4);
    border: 4px solid #FDFBF7;
    display: block;
  }
  .viewer .prev, .viewer .next {
    position: absolute; top: 50%; transform: translateY(-50%);
    width: 56px; height: 56px; border-radius: 50%;
    background: rgba(253,251,247,0.95); color: var(--klein);
    border: 1px solid var(--tiffany-line);
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; cursor: pointer;
    transition: all 0.25s;
  }
  .viewer .prev { left: -32px; }
  .viewer .next { right: -32px; }
  .viewer .prev:hover, .viewer .next:hover {
    background: var(--klein); color: #fff;
    transform: translateY(-50%) scale(1.1);
  }
  .viewer .close {
    position: absolute; top: -32px; right: -32px;
    width: 48px; height: 48px; border-radius: 50%;
    background: #EF4444; color: #fff;
    border: 3px solid #FDFBF7;
    display: flex; align-items: center; justify-content: center;
    font-size: 1.6rem; font-weight: 700; cursor: pointer;
    transition: all 0.25s;
  }
  .viewer .close:hover { transform: rotate(90deg) scale(1.12); }
  .viewer .counter {
    position: absolute; bottom: -42px; left: 50%; transform: translateX(-50%);
    color: #E8ECF5; font-family: var(--font-sans); font-size: 0.92rem;
    letter-spacing: 2px; white-space: nowrap;
  }
  .viewer .counter strong { color: var(--tiffany-2); font-weight: 700; }
  .viewer .name {
    position: absolute; top: -36px; left: 50%; transform: translateX(-50%);
    color: #E8ECF5; font-family: var(--font-serif); font-size: 1rem;
    letter-spacing: 1px; white-space: nowrap;
  }
  @media (hover: none) {
    body { cursor: auto; }
    .cursor-dot, .cursor-ring { display: none; }
  }
  @media (max-width: 820px) {
    .hint-bar { font-size: 0.72rem; padding: 8px 14px; gap: 8px; }
    .viewer .prev { left: 4px; } .viewer .next { right: 4px; }
    .viewer .close { top: -16px; right: -8px; width: 40px; height: 40px; font-size: 1.3rem; }
  }
</style>
</head>
<body>

<div class="cursor-dot" id="cursorDot"></div>
<div class="cursor-ring" id="cursorRing"></div>

<header class="banner">
  <a href="index.html" class="back">← 返回主页</a>
  <div class="brand">证书<strong>宇宙</strong> · CERT UNIVERSE</div>
  <span style="width:90px;"></span>
</header>

<div class="title">
  <h1><span class="solid">证书</span>宇宙</h1>
  <div class="sub">CERT · UNIVERSE · 16</div>
</div>

<div class="universe" id="universe">
  <div class="scene" id="scene"></div>
</div>

<div class="hint-bar">
  <span class="item">🖱 <b>拖动</b>旋转宇宙</span>
  <span class="sep">│</span>
  <span class="item">🖱 <b>单击</b>放大查看</span>
  <span class="sep">│</span>
  <span class="item">🖱 <b>双击</b>拽到正前方</span>
  <span class="sep">│</span>
  <span class="item"><span class="kbd">←</span> <span class="kbd">→</span> 切换</span>
  <span class="sep">│</span>
  <span class="item"><span class="kbd">Esc</span> 关闭</span>
</div>

<!-- 大图查看器 -->
<div class="viewer" id="viewer">
  <div class="vbox">
    <div class="name" id="vName"></div>
    <img id="vImg" src="" alt="证书">
    <button class="prev" id="vPrev">‹</button>
    <button class="next" id="vNext">›</button>
    <button class="close" id="vClose">×</button>
    <div class="counter"><strong id="vIdx">1</strong> / <span id="vTotal">16</span></div>
  </div>
</div>

<script>
const CERTS = [
  { src: 'cert.jpg.jpg',           name: '达摩院人工智能训练师初级' },
  { src: 'ai-trainer-advanced.jpg',name: '达摩院人工智能训练师高级' },
  { src: 'vision.png',             name: 'VISION人工智能设计入门' },
  { src: 'AIGC.png',               name: 'PAI ArtLab AIGC设计基础' },
  { src: 'Spring.png',             name: 'Spring AI 应用开发认证' },
  { src: 'RAG.png',                name: 'RAG 应用构建优化认证' },
  { src: 'blpt.png',               name: '百炼平台构建智能体' },
  { src: 'tylm.png',               name: '通义灵码高效AI编码' },
  { src: 'visionjj.png',           name: 'VISION 人工智能设计进阶' },
  { src: 'prduce.png',             name: '利用大模型提升内容生产能力' },
  { src: 'aaa.png',                name: 'AI提示师认证' },
  { src: 'bbb.png',                name: 'AI智能体认证' },
  { src: 'ccc.png',                name: 'AI大模型微调认证' },
  { src: 'ddd.png',                name: 'RAG检索增强生成认证' },
  { src: 'eee.png',                name: '玻尔Python全栈工程师认证' },
  { src: 'fff.png',                name: '华为AI微认证' }
];

/* ========== 自定义鼠标 ========== */
(function(){
  const dot = document.getElementById('cursorDot');
  const ring = document.getElementById('cursorRing');
  let mx = innerWidth/2, my = innerHeight/2;
  let rx = mx, ry = my;
  addEventListener('mousemove', e => {
    mx = e.clientX; my = e.clientY;
    dot.style.transform = `translate(${mx}px,${my}px) translate(-50%,-50%)`;
  });
  (function tick(){
    rx += (mx-rx)*0.22; ry += (my-ry)*0.22;
    ring.style.transform = `translate(${rx}px,${ry}px) translate(-50%,-50%)`;
    requestAnimationFrame(tick);
  })();
  document.addEventListener('mouseover', e => {
    if (e.target.closest('.card, .back, .viewer .prev, .viewer .next, .viewer .close')) document.body.classList.add('is-hovering');
  }, true);
  document.addEventListener('mouseout', e => {
    if (e.target.closest('.card, .back, .viewer .prev, .viewer .next, .viewer .close')) document.body.classList.remove('is-hovering');
  }, true);
})();

/* ========== 3D 宇宙布局：16张证书球形分布 ========== */
const scene = document.getElementById('scene');
const N = CERTS.length;
/* 球面均匀分布（费波那契球） */
const cards = [];
const PHI = Math.PI * (3 - Math.sqrt(5));
for (let i = 0; i < N; i++) {
  const y = 1 - (i / (N - 1)) * 2;
  const r = Math.sqrt(1 - y * y);
  const theta = PHI * i;
  const R = 380;  /* 球半径 */
  const x = Math.cos(theta) * r * R;
  const z = Math.sin(theta) * r * R;
  const yy = y * R * 0.7;
  /* 远近大小：z 越小（越远）→ scale 越小 */
  const scale = 0.55 + (z + R) / (2 * R) * 0.7;  /* 0.55 ~ 1.25 */
  /* 透明度：远的稍淡 */
  const opa = 0.5 + (z + R) / (2 * R) * 0.5;
  const el = document.createElement('div');
  el.className = 'card';
  el.dataset.idx = i;
  el.style.transform = `translate3d(${x}px, ${yy}px, ${z}px) scale(${scale})`;
  el.style.zIndex = Math.round(z + 1000);
  el.style.opacity = opa;
  el.innerHTML = `
    <div class="glow"></div>
    <div class="face">
      <img src="${CERTS[i].src}" alt="${CERTS[i].name}" loading="lazy"
           onerror="this.style.display='none'; this.parentElement.style.background='linear-gradient(145deg,#81D8D0,#002FA7)'; this.parentElement.innerHTML += '<div style=&quot;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-family:Inter,sans-serif;font-weight:700;font-size:1.4rem;&quot;>${String(i+1).padStart(2,'0')}</div>';">
      <div class="badge">${String(i+1).padStart(2,'0')}</div>
    </div>
  `;
  scene.appendChild(el);
  cards.push({ el, x, y: yy, z, scale, opa, idx: i });
}

/* ========== 鼠标拖动 → 旋转整个 scene（拖任意位置都旋转，含卡片） ========== */
let isDragging = false;
let dragStartX = 0, dragStartY = 0;
let rotY = 0, rotX = 0;
let targetRotY = 0, targetRotX = 0;
let targetRotY_start = 0, targetRotX_start = 0;
let mouseDownCard = null;  /* 按下时是否在卡片上，用于区分点击 vs 拖拽 */
let moved = false;

addEventListener('mousedown', e => {
  if (e.target.closest('.banner, .viewer, .hint-bar')) return;
  isDragging = true;
  moved = false;
  dragStartX = e.clientX; dragStartY = e.clientY;
  targetRotY_start = targetRotY; targetRotX_start = targetRotX;
  /* 记录是否点中卡片（用于mouseup时判定点击放大） */
  const card = e.target.closest('.card');
  mouseDownCard = card ? parseInt(card.dataset.idx, 10) : null;
  if (card) {
    card.classList.add('dragging');
    document.body.classList.add('is-dragging');
  }
});

addEventListener('mousemove', e => {
  if (!isDragging) return;
  const dx = e.clientX - dragStartX;
  const dy = e.clientY - dragStartY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
  /* 拖动任意位置（含卡片）= 旋转整个 scene，卡片随之转动 */
  targetRotY = targetRotY_start + dx * 0.4;
  targetRotX = targetRotX_start - dy * 0.3;
  targetRotX = Math.max(-50, Math.min(50, targetRotX));
});

addEventListener('mouseup', e => {
  if (!isDragging) return;
  /* 清除拖拽高亮 */
  document.querySelectorAll('.card.dragging').forEach(el => el.classList.remove('dragging'));
  document.body.classList.remove('is-dragging');
  /* 没移动 + 在卡片上 = 点击放大查看 */
  if (!moved && mouseDownCard !== null) {
    openViewer(mouseDownCard);
  }
  isDragging = false;
  mouseDownCard = null;
});

/* 双击卡片 → 自动旋转把该卡片拽到正前方 */
addEventListener('dblclick', e => {
  const card = e.target.closest('.card');
  if (!card) return;
  const idx = parseInt(card.dataset.idx, 10);
  const c = cards[idx];
  /* 把它的(x,z,y)旋转到正前方所需角度 */
  const angleY = Math.atan2(c.x, c.z);
  const angleX = Math.atan2(c.y, c.z);
  targetRotY = -angleY;
  targetRotX = -angleX;
});

/* 触屏支持（同样：拖动=旋转scene，单击=放大） */
addEventListener('touchstart', e => {
  if (e.target.closest('.banner, .viewer, .hint-bar')) return;
  const t = e.touches[0];
  isDragging = true;
  moved = false;
  dragStartX = t.clientX; dragStartY = t.clientY;
  targetRotY_start = targetRotY; targetRotX_start = targetRotX;
  const card = e.target.closest('.card');
  mouseDownCard = card ? parseInt(card.dataset.idx, 10) : null;
}, { passive: true });
addEventListener('touchmove', e => {
  if (!isDragging) return;
  const t = e.touches[0];
  const dx = t.clientX - dragStartX;
  const dy = t.clientY - dragStartY;
  if (Math.abs(dx) > 4 || Math.abs(dy) > 4) moved = true;
  targetRotY = targetRotY_start + dx * 0.4;
  targetRotX = targetRotX_start - dy * 0.3;
  targetRotX = Math.max(-50, Math.min(50, targetRotX));
}, { passive: true });
addEventListener('touchend', () => {
  if (!isDragging) return;
  if (!moved && mouseDownCard !== null) openViewer(mouseDownCard);
  isDragging = false;
  mouseDownCard = null;
});

/* 自动旋转 + lerp 平滑 */
let autoRot = 0.08;
function animate() {
  /* 没有拖拽时缓慢自动旋转 */
  if (!isDragging) {
    targetRotY += autoRot;
  }
  rotY += (targetRotY - rotY) * 0.08;
  rotX += (targetRotX - rotX) * 0.08;
  scene.style.transform = `translate(-50%, -50%) rotateX(${rotX}deg) rotateY(${rotY}deg)`;
  requestAnimationFrame(animate);
}
animate();

/* ========== 查看器 ========== */
const viewer = document.getElementById('viewer');
const vImg = document.getElementById('vImg');
const vName = document.getElementById('vName');
const vIdx = document.getElementById('vIdx');
const vTotal = document.getElementById('vTotal');
const vPrev = document.getElementById('vPrev');
const vNext = document.getElementById('vNext');
const vClose = document.getElementById('vClose');
let vCur = 0;
vTotal.textContent = N;
function openViewer(i) {
  vCur = (i + N) % N;
  vImg.src = CERTS[vCur].src;
  vImg.alt = CERTS[vCur].name;
  vName.textContent = CERTS[vCur].name;
  vIdx.textContent = vCur + 1;
  viewer.classList.add('show');
}
function closeViewer() { viewer.classList.remove('show'); }
function nav(d) {
  vCur = (vCur + d + N) % N;
  vImg.src = CERTS[vCur].src;
  vImg.alt = CERTS[vCur].name;
  vName.textContent = CERTS[vCur].name;
  vIdx.textContent = vCur + 1;
}
vPrev.addEventListener('click', () => nav(-1));
vNext.addEventListener('click', () => nav(1));
vClose.addEventListener('click', closeViewer);
viewer.addEventListener('click', e => { if (e.target === viewer) closeViewer(); });
addEventListener('keydown', e => {
  if (!viewer.classList.contains('show')) return;
  if (e.key === 'Escape') closeViewer();
  if (e.key === 'ArrowLeft') nav(-1);
  if (e.key === 'ArrowRight') nav(1);
});
</script>
</body>
</html>
